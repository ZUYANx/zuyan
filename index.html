<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UCHIHA EMPIRE - Gmail Spoof Tool</title>
  <style>
    body {
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      font-family: 'Segoe UI', sans-serif;
      color: #1b1b1b;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff1744;
      font-weight: bold;
    }

    input, button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      width: 250px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #388e3c;
    }

    #output {
      margin-top: 30px;
      text-align: left;
      background: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .copy-btn {
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      float: right;
      margin-top: -30px;
    }

    .copy-btn:hover {
      background-color: #1976d2;
    }

    .footer {
      margin-top: 50px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>UCHIHA EMPIRE</h1>
  <h2>Gmail Spoofing Tool (No API)</h2>
  <p>Enter any Gmail and get 50+ spoofed versions!</p>

  <input type="text" id="gmail" placeholder="example@gmail.com">
  <button onclick="generateSpoof()">Get Spoof</button>

  <div id="output" style="display:none;">
    <button class="copy-btn" onclick="copyResult()">Copy Gmail</button>
    <pre id="resultText">Loading...</pre>
  </div>

  <div class="footer">Made with ❤️ by MR ZUYAN TEAM - UCHIHA EMPIRE</div>

  <script>
    function validateEmail(email) {
      return /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email);
    }

    function generateVariations(local, domain, count = 50) {
      const variations = new Set();
      const length = local.length;

      while (variations.size < count) {
        let modified = local;
        const positions = [];

        while (positions.length < Math.floor(Math.random() * 3) + 1) {
          const pos = Math.floor(Math.random() * (length - 1)) + 1;
          if (!positions.includes(pos)) positions.push(pos);
        }

        positions.sort((a, b) => b - a);
        for (let pos of positions) {
          modified = modified.slice(0, pos) + '.' + modified.slice(pos);
        }

        variations.add(modified + '@' + domain);
      }

      return Array.from(variations);
    }

    function generateSpoof() {
      const gmail = document.getElementById('gmail').value.trim();
      if (!gmail) return alert("Please enter a Gmail!");

      if (!validateEmail(gmail)) {
        alert("Invalid Gmail address!");
        return;
      }

      const [local, domain] = gmail.split('@');
      const clones = generateVariations(local, domain);

      const result = {
        status: "success",
        original: gmail,
        total_clones: clones.length,
        clones: clones,
        author: "MR ZUYAN TEAM UCHIHA EMPIRE"
      };

      document.getElementById('resultText').innerText = JSON.stringify(result, null, 2);
      document.getElementById('output').style.display = 'block';
    }

    function copyResult() {
      const text = document.getElementById('resultText').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Copied to clipboard!");
      });
    }
  </script>

</body>
</html>
